---
# Black team SSH access: sshd trusts certificates signed by the Vault SSH CA.
# A cert works for a Windows account when one of its principals is listed in
# that account's principals file.
blackteam_ssh_ca_pubkey: >-
  ssh-rsa 

# Windows account -> list of principals allowed to log in as it. Competition
# hosts use "competition-infrastructure"; core hosts use "core-infrastructure".
blackteam_ssh_principals:
  Administrator: [competition-infrastructure]

blackteam_ssh_dir: 'C:\ProgramData\ssh'
