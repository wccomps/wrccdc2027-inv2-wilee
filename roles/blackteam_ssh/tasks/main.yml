---
# Assumes OpenSSH Server is already installed and running (set up by hand).

# The firewall is off on this box, but keep the rule so SSH still works if
# someone turns it back on.
- name: Allow SSH on every network profile
  ansible.windows.win_powershell:
    script: |
      $rule = Get-NetFirewallRule -Name OpenSSH-Server-In-TCP -ErrorAction SilentlyContinue
      if ($rule -and $rule.Profile -eq 'Any' -and $rule.Enabled -eq 'True') { $Ansible.Changed = $false; return }
      if ($rule) { Set-NetFirewallRule -Name OpenSSH-Server-In-TCP -Profile Any -Enabled True }
      else { New-NetFirewallRule -Name OpenSSH-Server-In-TCP -DisplayName 'OpenSSH Server (sshd)' -Enabled True -Direction Inbound -Protocol TCP -Action Allow -LocalPort 22 -Profile Any | Out-Null }

# Line-based (not win_copy) so other roles (vault_ssh_ca) can add their own
# CA keys and principals to the same files. sshd only honors the first
# TrustedUserCAKeys / AuthorizedPrincipalsFile, so every CA has to share them.
- name: Add Vault SSH CA public key
  community.windows.win_lineinfile:
    path: "{{ blackteam_ssh_dir }}\\vault-ca.pub"
    line: "{{ blackteam_ssh_ca_pubkey }}"
    create: true
    newline: unix
  notify: Restart sshd

- name: Create principals directory
  ansible.windows.win_file:
    path: "{{ blackteam_ssh_dir }}\\auth_principals"
    state: directory

- name: Add principals per account
  community.windows.win_lineinfile:
    path: "{{ blackteam_ssh_dir }}\\auth_principals\\{{ item.0.key }}"
    line: "{{ item.1 }}"
    create: true
    newline: unix
  loop: "{{ blackteam_ssh_principals | dict2items | subelements('value') }}"
  loop_control:
    label: "{{ item.0.key }}: {{ item.1 }}"
  notify: Restart sshd

- name: Trust the CA in sshd_config
  ansible.windows.win_powershell:
    script: "{{ lookup('file', 'sshd_config_ca.ps1') }}"
  notify: Restart sshd
