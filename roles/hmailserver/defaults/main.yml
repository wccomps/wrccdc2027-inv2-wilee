---
# --- REQUIRED: set these for your environment ---------------------------------
# Direct URL to the hMailServer installer .exe (grab the build you want from
# https://www.hmailserver.com/download and paste the direct file link here).
hmail_installer_url: ""          # e.g. https://www.hmailserver.com/files/hMailServer-5.6.8-B2574.2.exe

# Password used for the hMailServer "Administrator" (COM/admin console) account.
# Passed to the installer via /ADMINPASSWORD. Avoid characters that break an
# Inno Setup command line (spaces, quotes, &, ^, %).
hmail_admin_password: "ChangeMe-Admin1!"

# Domains and mailboxes to create.
#   accounts:     local mailboxes with their own hMailServer password
#                 (or AD-backed: ad_username + ad_domain instead of password)
#   ad_accounts:  AD usernames; each gets <user>@<name>, authenticating against
#                 AD domain ad_domain (defaults to name)
#   from_ad:      true = a mailbox for every enabled AD user (narrow with ad_filter)
#   ad_max_size:  quota in MB for ad_accounts / from_ad mailboxes
hmail_domains:
  - name: example.com
    accounts:
      - address: postmaster@example.com
        password: "ChangeMe-Mbox1!"
      - address: user@example.com
        password: "ChangeMe-Mbox1!"
    ad_accounts: []

# Ban IPs after repeated failed logons. Off is safer when a scoring engine
# logs in from a fixed address.
hmail_autoban_on_logon_failure: true

# --- Paths / install options (usually fine as-is) -----------------------------
hmail_installer_dest: 'C:\Windows\Temp\hMailServerSetup.exe'
hmail_install_dir: 'C:\Program Files (x86)\hMailServer'
hmail_service_name: hMailServer
