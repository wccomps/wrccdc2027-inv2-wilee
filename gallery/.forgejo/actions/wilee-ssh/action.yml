# Mint a short-lived Vault-signed SSH cert for wilee and pin its host key.
# Leaves id_ed25519, id_ed25519-cert.pub and known_hosts in $RUNNER_TEMP/ssh.
name: wilee-ssh
description: Vault-signed SSH key + pinned known_hosts for wilee

inputs:
  vault-addr:
    required: true
  role-id:
    required: true
  secret-id:
    required: true
  host:
    default: wilee.acme.anvil
  # Pin wilee's host key so a spoofed box can't receive the deploy.
  hostkey-fp:
    default: SHA256:+zuseALdEesj7GAvOslwscK89jcr8d0QPndtHu7Ho4U

runs:
  using: composite
  steps:
    - name: Mint short-lived SSH cert
      shell: bash
      env:
        VAULT_ADDR: ${{ inputs.vault-addr }}
        VAULT_ROLE_ID: ${{ inputs.role-id }}
        VAULT_SECRET_ID: ${{ inputs.secret-id }}
      run: |
        set -euo pipefail
        k="$RUNNER_TEMP/ssh"
        rm -rf "$k" && mkdir -m 700 "$k"
        ssh-keygen -q -t ed25519 -N '' -f "$k/id_ed25519"

        export VAULT_TOKEN=$(vault write -field=token auth/approle/login \
          role_id="$VAULT_ROLE_ID" secret_id="$VAULT_SECRET_ID")
        trap 'vault token revoke -self >/dev/null || true' EXIT
        vault write -field=signed_key ssh/sign/wilee \
          public_key=@"$k/id_ed25519.pub" valid_principals=wilee ttl=10m \
          > "$k/id_ed25519-cert.pub"

    - name: Trust wilee's host key
      shell: bash
      env:
        HOST: ${{ inputs.host }}
        HOSTKEY_FP: ${{ inputs.hostkey-fp }}
      run: |
        set -euo pipefail
        k="$RUNNER_TEMP/ssh"
        ssh-keyscan -t ed25519 "$HOST" 2>/dev/null > "$k/known_hosts"
        fp=$(ssh-keygen -lf "$k/known_hosts" | awk '{print $2}')
        if [ "$fp" != "$HOSTKEY_FP" ]; then
          echo "wilee host key mismatch: got $fp" >&2; exit 1
        fi
