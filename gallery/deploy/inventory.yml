all:
  hosts:
    wilee:
      ansible_host: wilee.acme.anvil
      ansible_user: Administrator
      ansible_connection: ssh
      ansible_shell_type: cmd
      ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_DIR') }}/id_ed25519"
      ansible_ssh_common_args: >-
        -o IdentitiesOnly=yes
        -o UserKnownHostsFile={{ lookup('env', 'SSH_DIR') }}/known_hosts
        -o StrictHostKeyChecking=yes
