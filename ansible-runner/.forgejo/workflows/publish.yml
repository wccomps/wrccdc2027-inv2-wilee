# Rebuild the ansible-runner image every 30 minutes and push it to the
# Forgejo registry. A failed build (no internet, broken DNS) just fails this
# run: the last good :latest stays in the registry and in elmer's Docker, so
# deploys keep working offline.
#
# Repo settings needed:
#   secrets: REGISTRY_TOKEN (Forgejo token with package write)
# Runner needs the Docker socket mounted into job containers (see README).
name: publish

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

env:
  IMAGE: gitea.acme.anvil/wile.coyote/ansible-runner

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: docker build --pull -t "$IMAGE:candidate" .

      # Only replace :latest with an image that actually has the tools.
      - name: Smoke test
        run: |
          docker run --rm "$IMAGE:candidate" sh -euc '
            vault version
            ansible --version
            ansible-galaxy collection list ansible.windows
          '

      # Tag locally first: deploys use elmer's local :latest (force_pull off).
      - name: Tag
        run: docker tag "$IMAGE:candidate" "$IMAGE:latest"

      # skopeo, not docker push: with elmer's containerd image store, docker
      # push tries HTTPS and won't fall back to HTTP. skopeo does with
      # --dest-tls-verify=false. 22.04's skopeo is too old for the daemon API
      # (docker-daemon: transport), so go through a docker save tarball.
      - name: Push
        env:
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          apt-get update -qq && apt-get install -y -qq skopeo
          tar="$RUNNER_TEMP/image.tar"
          trap 'rm -f "$tar"' EXIT
          docker save -o "$tar" "$IMAGE:candidate"
          # Only :latest. Every rebuild has fresh apt/pip layers, so dated tags
          # would fill the registry's disk; the replaced layers are freed by
          # Forgejo's package cleanup.
          skopeo copy --dest-tls-verify=false --dest-creds "$OWNER:$REGISTRY_TOKEN" \
            "docker-archive:$tar" "docker://$IMAGE:latest"

      # Builds run on elmer's own Docker, and each rebuild orphans the previous
      # image and leaves build cache behind; every 30 min that fills the disk.
      # Only untagged images and day-old cache: :latest and anything a
      # container uses are kept.
      - name: Clean up old images and build cache
        if: always()
        run: |
          docker image prune -f
          docker builder prune -f --filter until=24h
