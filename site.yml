---
- name: Provision Wile-E 
  hosts: windows
  gather_facts: false
  pre_tasks:
    - name: Verify WinRM connectivity
      ansible.windows.win_ping:
      tags: always

  roles:
    - { role: shell_history, tags: shell_history }
    - { role: disable_defender, tags: disable_defender }
    - { role: disable_firewall, tags: disable_firewall }
    - { role: install_python, tags: install_python }
    - { role: install_git, tags: install_git }
    - { role: hmailserver, tags: hmailserver }
    - { role: webmail, tags: webmail }
    - { role: windows_exporter, tags: windows_exporter }
    - { role: blackteam_ssh, tags: blackteam_ssh }
    - { role: vault_ssh_ca, tags: vault_ssh_ca }
